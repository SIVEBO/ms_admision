spring:
  application:
    name: ms_admision
  profiles:
    active: dev
  datasource:
    url: jdbc:mariadb://localhost:3306/db_ms_admision?createDatabaseIfNotExist=true
    username: root
    password:
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format:
          sql: true

server:
  port: 8087

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# URLs de los microservicios externos consultados via WebClient
ms:
  clientes:
    url: http://localhost:8085
  sucursales:
    url: http://localhost:8083
  auth:
    url: http://localhost:8086
  tracking:
    url: http://localhost:8093
